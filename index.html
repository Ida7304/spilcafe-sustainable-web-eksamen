<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spilcaféen | Spiloversigt</title>
    <link rel="shortcut icon" href="Images/Logo spilcafeen.png" type="image/x-icon">
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
<!-- Header/Navigation -->
    <header>
        <a href="index.html">
         <img src="Images/Logo spilcafeen.png" alt="spilcafé logo hjem" class="logo"/>
         </a>
        <div class="ikoner">
            <a href="profilside.html" class="nav-item">
              <div class="nav-icon">
                <img src="Images/bruger.svg" alt="Bruger" />
              </div>
            </a>
            <a href="favoritside.html" class="nav-item">
              <div class="nav-icon">
                <img src="Images/hejrte.svg" alt="Favoritter" />
              </div>
            </a>   
        </div>
    </header>

    <!-- Overskrift -->
    <main>
        <div class="games-header">
          <h1>Spiloversigt</h1>
        </div>

      <!-- Lokation filter -->
      <div class="header-location">
        <select id="location-select" aria-label="Vælg lokation">
          <option value="all">Alle lokationer</option>
        </select>
    

      <!-- Søgefelt og filtre -->
      <div class="header-controls">
        <form class="header-search" role="search">
          <input type="search" id="header-search-input" placeholder="Søg spil..." aria-label="Søg spil"/>
        </form>

        <button id="filter-toggle" class="filter-toggle" aria-label="Åben filtre">
          <h2>Filtrér</h2>
          <span id="filter-badge" class="filter-badge" style="display: none" >0</span>
        </button>
      </div>

      <!-- Filter dropdown panel -->
      <div class="filter-panel" id="filter-panel">
  
          <h3>Filtrér spil</h3>
          
          <!-- Valgmuligheder -->
          <div class="filter-row">
            <label for="header-sort-select">Sortér efter</label>
            <select id="header-sort-select">
              <option value="all">Ingen sortering</option>
              <option value="title">Titel (A-Å)</option>
              <option value="title2">Titel (Å-A)</option>
              <option value="rating">Mest populære</option>
            </select>
          </div>
          <!-- Kategori filter -->
          <div class="filter-row">
            <label for="header-genre-select">Kategori</label>
            <select id="header-genre-select">
              <option value="none">Alle kategorier</option>
            </select>
          </div>
          <!-- Antal spillere filter -->
          <div class="filter-row">
            <label for="header-players-from">Antal spillere</label>
            <div class="range-inputs">
              <input type="number" id="header-players-from" placeholder="Fra" min="1" max="8" step="1"/>
            </div>
          </div>
          <!-- Spilletid filter -->
          <div class="filter-row">
            <label for="header-playtime-from">Spilletid (min):</label>
            <div class="range-inputs">
              <input type="number" id="header-playtime-from" placeholder="Fra" min="0" max="300" step="15"/>
              <span>til</span>
              <input type="number" id="header-playtime-to" placeholder="Til" min="0" max="300" step="15" aria-label="Spilletid til"/>
            </div>
          </div>
          <!-- Sværhedsgrad filter -->
          <div class="filter-row">
            <label for="header-difficulty-select">Sværhedsgrad</label>
            <select id="header-difficulty-select">
              <option value="none">Alle sværhedsgrader</option>
              <option value="Let">Let</option>
              <option value="Mellem">Mellem</option>
              <option value="Svær">Svær</option>
            </select>
          </div>
          <!-- Alder filter -->
          <div class="filter-row">
            <label for="header-age-from">Min. Alder</label>
            <div class="range-inputs">
              <input type="number" id="header-age-from" placeholder="Fra" min="0" max="100" step="1"/>
            </div>
          </div>
          <!-- Rating filter -->
          <div class="filter-row">
            <label for="header-rating-from">Rating:</label>
            <div class="range-inputs">
              <input type="number" id="header-rating-from" placeholder="Fra" min="0" max="5" step="1"/>
              <span>til</span>
              <input type="number" id="header-rating-to" placeholder="Til" min="0" max="5" step="1" aria-label="Rating til"/>
            </div>
          </div>
          <!-- Ryd/vis resultater -->
          <div class="filter-actions">
            <button id="header-clear-filters" class="clear-btn">Ryd alle filtre</button>
            <button id="filter-close" class="close-btn">Vis resultater</button>
          </div>
      </div>
      <!-- Aktiv filtrerings display -->
      <section class="active-filters-section" id="active-filters-section" style="display: none">
        <div class="active-filters-container">
          <div class="active-filters-list" id="active-filters-list">
          </div>
        </div>
      </section>
      </div>
      <!-- Spilliste -->
      <section id="game-list"></section>
  
    </main>

    <!-- Spil pop op -->
    <dialog id="game-dialog">
      <form method="dialog">
        <button id="close-dialog" aria-label="Luk">✕</button>
        <div id="dialog-content">
          <!-- Spil indsættes her via JavaScript -->
        </div>
      </form>
    </dialog>

 

    <script src="js/app.js"></script>

  </body>
</html>
