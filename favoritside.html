<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spilcaféen | Favoritside</title>
    <link rel="shortcut icon" href="Images/Logo-spilcafeen.webp" type="image/x-icon">
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <a href="index.html">
        <img src="Images/Logo-spilcafeen.webp" alt="Spilcaféen logo hjem" class="logo"/>
      </a>
       <div class="ikoner">
            <a href="profilside.html" class="nav-item">
              <div class="nav-icon">
                <img src="Images/bruger.svg" alt="Bruger" />
              </div>
            </a>
            <a href="favoritside.html" class="nav-item">
              <div class="nav-icon">
                <img src="Images/hejrte.svg" alt="Favoritter" />
              </div>
            </a>   
        </div>
      

    </header>

    <!-- Main content -->
    <main>
      <!-- Page header -->
      <section>
        <div class="games-header">
          <h1 id="favorites-count">Mine Favoritter (0 spil)</h1>
        </div>
      </section>

      <!-- No favorites message (hidden initially) -->
      <div class="no-favorites" id="no-favorites" style="display: none">
        <h2>Du har ingen favoritter endnu</h2>
        <p>
          Klik på ❤️ ikonerne på spillene for at tilføje dem til dine
          favoritter!
        </p>
        <a href="index.html" class="bottom-nav-item">Se alle spil</a>
      </div>

      <!-- Game list -->
      <section id="game-list" class="game-grid"></section>
    </main>

    <!-- Game Modal -->
    <dialog id="game-dialog">
      <form method="dialog">
        <button id="close-dialog" aria-label="Close">✕</button>
        <div id="dialog-content">
          <!-- Game details will be injected here via JavaScript -->
        </div>
      </form>
    </dialog>

    <script src="js/favoritside.js"></script>
  </body>
</html>
