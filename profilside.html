<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min profil - Games App</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Header -->
    <header>
      <a href="index.html">
        <img src="Images/Logo-spilcafeen.webp" alt="Games App Logo" class="logo" />
      </a>
       <div class="ikoner">
            <a href="profilside.html" class="nav-item">
              <div class="nav-icon">
                <img src="Images/bruger.svg" alt="Bruger" />
              </div>
            </a>
            <a href="favoritside.html" class="nav-item">
              <div class="nav-icon">
                <img src="Images/hejrte.svg" alt="Favoritter" />
              </div>
            </a>   
        </div>
      
    </header>
    

    <!-- Main content -->
    <main>
        <!-- Page header -->
        <section>
            <div class="games-header">
                <h1 id="p-count">Din profil</h1>
            </div>
        </section>

        <!-- No profile message (always visible for now) -->
        <div class="no-profile" id="no-profile">
            <h2>Velkommen til din profil</h2>
            <p>Her kan du se dine bruger-indstillinger.<br />Denne funktion er under udvikling.</p>
            <a href="index.html" class="bottom-nav-item">Se alle spil</a>
        </div>

        <!-- Game list -->
        <section id="game-list" class="game-grid">
        </section>
    </main>

    <!-- Game Modal -->
    <dialog id="game-dialog">
        <form method="dialog">
            <button id="close-dialog" aria-label="Close">✕</button>
            <div id="dialog-content">
                <!-- Game details will be injected here via JavaScript -->
            </div>
        </form>
    </dialog>

    <script src="js/favoritside.js"></script>
</body>
</html>
